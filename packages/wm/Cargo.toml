[package]
name = "wm"
version = "0.0.0"
description = "LoneWM is a Windows-only tiling window manager inspired by i3, forked from GlazeWM."
repository = "https://github.com/Louis047/LoneWM"
license = "GPL-3"
edition = "2021"
default-run = "lonewm"

[[bin]]
name = "lonewm"
path = "src/main.rs"

[features]
ui_access = []

[build-dependencies]
tauri-winres = { workspace = true }

[dependencies]
anyhow = { workspace = true }
auto-launch = "0.5"
ambassador = "0.4"
clap = { workspace = true }
enum-as-inner = "0.6"
futures-util = { workspace = true }
home = { workspace = true }
image = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
socket2 = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { workspace = true }
tray-icon = "0.21"
uuid = { workspace = true }
wm-cli = { path = "../wm-cli" }
wm-common = { path = "../wm-common" }
wm-ipc-client = { path = "../wm-ipc-client" }
wm-macros = { workspace = true }
wm-platform = { path = "../wm-platform" }

[dev-dependencies]
bon = "3"
wm-platform = { path = "../wm-platform", features = ["test_utils"] }
